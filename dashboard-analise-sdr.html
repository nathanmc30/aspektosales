<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise SDR — Aspekto</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2333;
    --border: #2a3045;
    --text: #e8eaf0;
    --text-muted: #7b8299;
    --accent: #4f7cff;
    --accent-dim: #1e2d5a;
    --green: #2dd67c;
    --green-dim: #0f3322;
    --orange: #ff8c42;
    --orange-dim: #3a1f08;
    --red: #ff4d6a;
    --yellow: #ffd166;
    --seller: #a78bfa;
    --seller-dim: #1e1438;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5; }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
  .logo span { color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .refresh-btn { background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); padding: 6px 14px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; }
  .refresh-btn:hover { background: var(--accent); color: #fff; }
  .last-update { color: var(--text-muted); font-size: 12px; }

  /* FILTROS */
  .filters { padding: 16px 24px; display: flex; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--surface); }
  select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 12px; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; outline: none; }
  select:focus { border-color: var(--accent); }

  /* KPIS */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; padding: 20px 24px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .kpi-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--text-muted); margin-bottom: 8px; }
  .kpi-value { font-size: 28px; font-weight: 700; line-height: 1; }
  .kpi-value.accent { color: var(--accent); }
  .kpi-value.green { color: var(--green); }
  .kpi-value.orange { color: var(--orange); }
  .kpi-value.yellow { color: var(--yellow); }
  .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  /* CONTENT */
  .content { display: grid; grid-template-columns: 1fr 340px; gap: 0; height: calc(100vh - 170px); }
  .conversations-panel { border-right: 1px solid var(--border); overflow-y: auto; }
  .ranking-panel { overflow-y: auto; padding: 16px; }

  /* SECTION HEADERS */
  .section-header { padding: 14px 20px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text-muted); border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; display: flex; justify-content: space-between; align-items: center; }

  /* CONVERSATION CARDS */
  .conv-card { padding: 14px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .conv-card:hover { background: var(--surface); }
  .conv-card.active { background: var(--accent-dim); border-left: 3px solid var(--accent); }
  .conv-info { flex: 1; min-width: 0; }
  .conv-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-name .etapa { font-size: 11px; font-weight: 500; color: var(--text-muted); margin-left: 6px; }
  .conv-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 10px; }
  .conv-right { text-align: right; flex-shrink: 0; }
  .audio-badge { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .audio-badge.all-done { color: var(--green); }
  .audio-badge.pending { color: var(--orange); }
  .audio-badge.no-audio { color: var(--text-muted); }

  /* RANKING */
  .ranking-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .6px; }
  .rank-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
  .rank-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .rank-name { font-weight: 600; font-size: 13px; }
  .rank-pos { font-size: 11px; color: var(--text-muted); font-weight: 700; }
  .rank-bars { display: flex; flex-direction: column; gap: 4px; }
  .rank-bar-row { display: flex; align-items: center; gap: 6px; }
  .rank-bar-label { font-size: 11px; color: var(--text-muted); width: 36px; flex-shrink: 0; }
  .rank-bar-track { flex: 1; background: var(--border); border-radius: 3px; height: 6px; overflow: hidden; }
  .rank-bar-fill { height: 100%; border-radius: 3px; transition: width .3s; }
  .rank-bar-fill.aval { background: var(--accent); }
  .rank-bar-fill.closer { background: var(--green); }
  .rank-bar-fill.audio { background: var(--yellow); }
  .rank-bar-val { font-size: 11px; color: var(--text-muted); width: 24px; text-align: right; flex-shrink: 0; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 680px; max-width: 95vw; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-header { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .modal-close { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; line-height: 1; padding: 2px 4px; }
  .modal-close:hover { color: var(--text); }
  .modal-body { overflow-y: auto; padding: 16px 20px; flex: 1; }

  /* MENSAGENS */
  .msg { margin-bottom: 8px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .msg.customer { align-items: flex-start; }
  .msg-bubble { max-width: 78%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
  .msg.user .msg-bubble { background: var(--accent-dim); border: 1px solid var(--accent); border-bottom-right-radius: 3px; }
  .msg.customer .msg-bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg-time { font-size: 10px; color: var(--text-muted); margin-top: 3px; }

  /* TIPOS ESPECIAIS */
  .msg-audio { display: flex; align-items: flex-start; gap: 8px; }
  .msg-audio-icon { font-size: 16px; margin-top: 1px; flex-shrink: 0; }
  .msg-audio-content { flex: 1; }
  .msg-audio-label { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 3px; }
  .msg-transcricao { font-size: 13px; line-height: 1.5; }
  .msg-pending { color: var(--orange); font-style: italic; font-size: 12px; }
  .msg-image { color: var(--seller); font-style: italic; font-size: 12px; }
  .msg-template { color: var(--yellow); font-size: 12px; }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }

  /* LOADING */
  .loading { text-align: center; padding: 40px; color: var(--text-muted); }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin-bottom: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Aspekto <span>SDR</span></div>
  <div class="header-right">
    <span class="last-update" id="lastUpdate">—</span>
    <button class="refresh-btn" onclick="carregar()">↻ Atualizar</button>
  </div>
</div>

<div class="filters">
  <select id="filtPeriodo" onchange="aplicarFiltros()">
    <option value="7">Últimos 7 dias</option>
    <option value="30" selected>Últimos 30 dias</option>
    <option value="90">Últimos 90 dias</option>
  </select>
  <select id="filtEtapa" onchange="aplicarFiltros()">
    <option value="">Todas as etapas</option>
    <option value="aval">Aval. Agendada</option>
    <option value="closer">Closer</option>
  </select>
  <select id="filtVendedor" onchange="aplicarFiltros()">
    <option value="">Todos vendedores</option>
  </select>
</div>

<div class="kpis" id="kpis">
  <div class="kpi"><div class="kpi-label">Total</div><div class="kpi-value accent" id="kTotal">—</div></div>
  <div class="kpi"><div class="kpi-label">Aval. Agendada</div><div class="kpi-value accent" id="kAval">—</div></div>
  <div class="kpi"><div class="kpi-label">Closer</div><div class="kpi-value green" id="kCloser">—</div></div>
  <div class="kpi"><div class="kpi-label">Áudios transcritos</div><div class="kpi-value yellow" id="kAudios">—</div></div>
  <div class="kpi"><div class="kpi-label">Áudios pendentes</div><div class="kpi-value orange" id="kPendentes">—</div></div>
</div>

<div class="content">
  <div class="conversations-panel">
    <div class="section-header">
      <span>Últimas conversas</span>
      <span id="convCount" style="font-weight:400;color:var(--text-muted)"></span>
    </div>
    <div id="convList"><div class="loading"><div class="spinner"></div><br>Carregando...</div></div>
  </div>
  <div class="ranking-panel">
    <div class="section-header"><span>Ranking vendedores</span></div>
    <div id="ranking" style="padding-top:12px"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalTitle">—</div>
        <div class="modal-sub" id="modalSub">—</div>
      </div>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const SUPA_URL = 'https://mwlxudtdvflygvewuwal.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13bHh1ZHRkdmZseWd2ZXd1d2FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTI5NDgsImV4cCI6MjEwMDM4ODk0OH0.Hwix2vzrTiAfQwa993TVQTTE8ndCnlXKSew3qh4D57Q';

let dados = [];
let filtrados = [];
let convAtiva = null;

async function carregar() {
  document.getElementById('convList').innerHTML = '<div class="loading"><div class="spinner"></div><br>Carregando...</div>';
  try {
    const resp = await fetch(`${SUPA_URL}/rest/v1/conversations?select=*&order=conversation_date.desc&limit=200`, {
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` }
    });
    const raw = await resp.json();
    // Deduplica por deal_id
    const mapa = {};
    for (const r of raw) { mapa[r.deal_id] = r; }
    dados = Object.values(mapa);
    preencherVendedores();
    aplicarFiltros();
    document.getElementById('lastUpdate').textContent = 'Atualizado ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    document.getElementById('convList').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Erro ao carregar dados</div>';
  }
}

function preencherVendedores() {
  const sel = document.getElementById('filtVendedor');
  const atual = sel.value;
  const nomes = [...new Set(dados.map(d => d.seller_name).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Todos vendedores</option>' + nomes.map(n => `<option value="${n}">${n}</option>`).join('');
  sel.value = atual;
}

function aplicarFiltros() {
  const dias = parseInt(document.getElementById('filtPeriodo').value);
  const etapa = document.getElementById('filtEtapa').value;
  const vendedor = document.getElementById('filtVendedor').value;
  const corte = new Date(Date.now() - dias * 86400000).toISOString().split('T')[0];

  filtrados = dados.filter(d => {
    if (d.conversation_date < corte) return false;
    if (etapa && d.tipo !== etapa) return false;
    if (vendedor && d.seller_name !== vendedor) return false;
    return true;
  });

  renderKpis();
  renderConversas();
  renderRanking();
}

function contarAudios(msgs) {
  const total = (msgs||[]).filter(m => m.content_type === 'AUDIO' && m.content_url).length;
  const transcritos = (msgs||[]).filter(m => m.content_type === 'AUDIO' && m.content_url && m.transcricao && !m.transcricao.startsWith('[')).length;
  return { total, transcritos, pendentes: total - transcritos };
}

function renderKpis() {
  const total = filtrados.length;
  const aval = filtrados.filter(d => d.tipo === 'aval').length;
  const closer = filtrados.filter(d => d.tipo === 'closer').length;
  let totalAudios = 0, transcritos = 0, pendentes = 0;
  for (const d of filtrados) {
    const a = contarAudios(d.raw_messages);
    totalAudios += a.total;
    transcritos += a.transcritos;
    pendentes += a.pendentes;
  }
  document.getElementById('kTotal').textContent = total;
  document.getElementById('kAval').textContent = aval;
  document.getElementById('kCloser').textContent = closer;
  document.getElementById('kAudios').textContent = `${transcritos}/${totalAudios}`;
  document.getElementById('kPendentes').textContent = pendentes;
}

function renderConversas() {
  const el = document.getElementById('convList');
  document.getElementById('convCount').textContent = filtrados.length + ' conversas';
  if (!filtrados.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">💬</div>Nenhuma conversa encontrada</div>';
    return;
  }
  el.innerHTML = filtrados.map(d => {
    const a = contarAudios(d.raw_messages);
    let audioBadge, audioClass;
    if (a.total === 0) { audioBadge = 'sem áudios'; audioClass = 'no-audio'; }
    else if (a.pendentes === 0) { audioBadge = `✓ ${a.transcritos}/${a.total} áudios`; audioClass = 'all-done'; }
    else { audioBadge = `⏳ ${a.transcritos}/${a.total} áudios`; audioClass = 'pending'; }
    const etapa = d.tipo === 'aval' ? 'Aval.' : 'Closer';
    const msgs = (d.raw_messages||[]).length;
    const isActive = convAtiva === d.deal_id ? 'active' : '';
    return `<div class="conv-card ${isActive}" onclick="abrirModal('${d.deal_id}')">
      <div class="conv-info">
        <div class="conv-name">${d.seller_name || '—'}<span class="etapa">· ${etapa}</span></div>
        <div class="conv-meta">
          <span>📅 ${d.conversation_date||'—'}</span>
          <span>📱 ${d.telefone||'—'}</span>
          <span>💬 ${msgs} msgs</span>
        </div>
      </div>
      <div class="conv-right">
        <div class="audio-badge ${audioClass}">${audioBadge}</div>
      </div>
    </div>`;
  }).join('');
}

function renderRanking() {
  const el = document.getElementById('ranking');
  const mapa = {};
  for (const d of filtrados) {
    const n = d.seller_name || '—';
    if (!mapa[n]) mapa[n] = { aval: 0, closer: 0, audios: 0, transcritos: 0 };
    if (d.tipo === 'aval') mapa[n].aval++;
    else mapa[n].closer++;
    const a = contarAudios(d.raw_messages);
    mapa[n].audios += a.total;
    mapa[n].transcritos += a.transcritos;
  }
  const lista = Object.entries(mapa).map(([nome, v]) => ({ nome, ...v, total: v.aval + v.closer })).sort((a,b) => b.total - a.total);
  const maxTotal = Math.max(...lista.map(x => x.total), 1);
  const maxAudio = Math.max(...lista.map(x => x.audios), 1);
  el.innerHTML = lista.map((v, i) => `
    <div class="rank-item">
      <div class="rank-header">
        <span class="rank-name">${v.nome}</span>
        <span class="rank-pos">#${i+1} · ${v.total} conv.</span>
      </div>
      <div class="rank-bars">
        <div class="rank-bar-row">
          <span class="rank-bar-label" style="color:var(--accent)">Aval</span>
          <div class="rank-bar-track"><div class="rank-bar-fill aval" style="width:${(v.aval/maxTotal*100).toFixed(0)}%"></div></div>
          <span class="rank-bar-val">${v.aval}</span>
        </div>
        <div class="rank-bar-row">
          <span class="rank-bar-label" style="color:var(--green)">Close</span>
          <div class="rank-bar-track"><div class="rank-bar-fill closer" style="width:${(v.closer/maxTotal*100).toFixed(0)}%"></div></div>
          <span class="rank-bar-val">${v.closer}</span>
        </div>
        <div class="rank-bar-row">
          <span class="rank-bar-label" style="color:var(--yellow)">Áudio</span>
          <div class="rank-bar-track"><div class="rank-bar-fill audio" style="width:${(v.transcritos/Math.max(v.audios,1)*100).toFixed(0)}%"></div></div>
          <span class="rank-bar-val">${v.transcritos}/${v.audios}</span>
        </div>
      </div>
    </div>`).join('');
}

function abrirModal(dealId) {
  convAtiva = dealId;
  const d = dados.find(x => x.deal_id === dealId);
  if (!d) return;
  document.getElementById('modalTitle').textContent = `${d.seller_name || '—'} — ${d.tipo === 'aval' ? 'Aval. Agendada' : 'Closer'}`;
  const a = contarAudios(d.raw_messages);
  document.getElementById('modalSub').textContent = `${d.conversation_date} · ${d.telefone||'—'} · ${(d.raw_messages||[]).length} msgs · ${a.transcritos}/${a.total} áudios`;
  
  const msgs = (d.raw_messages || []);
  document.getElementById('modalBody').innerHTML = msgs.length
    ? msgs.map(m => renderMensagem(m)).join('')
    : '<div class="empty"><div class="empty-icon">💬</div>Sem mensagens</div>';
  
  document.getElementById('modalOverlay').classList.add('open');
  renderConversas(); // atualiza active state
}

function renderMensagem(m) {
  const lado = m.type === 'USER' ? 'user' : 'customer';
  const hora = m.created_at ? new Date(m.created_at).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';

  let conteudo = '';

  if (m.content_type === 'AUDIO') {
    const duracao = m.seconds ? `${Math.round(m.seconds)}s` : '';
    let transcricaoHTML = '';
    if (m.transcricao && !m.transcricao.startsWith('[')) {
      transcricaoHTML = `<div class="msg-transcricao">${m.transcricao}</div>`;
    } else {
      transcricaoHTML = `<div class="msg-pending">🎵 Áudio pendente${duracao ? ` · ${duracao}` : ''}</div>`;
    }
    conteudo = `<div class="msg-audio">
      <span class="msg-audio-icon">🎙️</span>
      <div class="msg-audio-content">
        <div class="msg-audio-label">Áudio${duracao ? ` · ${duracao}` : ''}</div>
        ${transcricaoHTML}
      </div>
    </div>`;
  } else if (m.content_type === 'IMAGE') {
    conteudo = `<div class="msg-image">🖼️ Imagem</div>`;
  } else if (m.content_type === 'TEMPLATE') {
    const texto = m.content || (m.content_object?.components?.[0]?.formatted_text) || 'Template';
    conteudo = `<div class="msg-template">📋 ${texto}</div>`;
  } else if (m.content) {
    conteudo = m.content;
  } else {
    conteudo = `<span style="color:var(--text-muted);font-style:italic;font-size:12px">${m.content_type||'—'}</span>`;
  }

  return `<div class="msg ${lado}">
    <div class="msg-bubble">${conteudo}</div>
    <div class="msg-time">${hora}</div>
  </div>`;
}

function fecharModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('open');
  convAtiva = null;
  renderConversas();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

carregar();
setInterval(carregar, 5 * 60 * 1000);
</script>
</body>
</html>
